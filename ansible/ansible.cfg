[defaults]
# Pass a deployment directory: ansible-playbook -i inventories/<name> site.yml
roles_path = roles/
host_key_checking = False
retry_files_enabled = False
vault_password_file = ../.vault-password
inventory_ignore_patterns = \.example$, \.DS_Store$
hash_behaviour = merge

[ssh_connection]
# Ansible's defaults plus keepalives. A connection can be cut silently (a
# home router dropping its NAT state while a node reboots, or a node going
# down mid-session): neither end sends a RST, and without keepalives the
# reused (ControlPersist) connection hangs forever, as the reboot wait did.
# With them, a dead connection fails within ~30 s and the next command opens
# a fresh one. Through a jump host the keepalives run end to end, so they
# also catch a dead hop.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=5 -o ServerAliveCountMax=6
# Retry a connection that fails outright (ssh exit 255): a cut connection
# as above, or the SSH agent briefly refusing to sign. A node reached
# through a jump host signs twice per connection.
retries = 3

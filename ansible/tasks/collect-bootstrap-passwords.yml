---
- name: Build list of hosts that need a password this round
  ansible.builtin.set_fact:
    _bootstrap_hosts: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for h in ansible_play_hosts_all -%}
        {%- if (hostvars[h].wormhole_ssh_reachable | default(false) | bool)
              and not (hostvars[h].wormhole_ssh_key_ok | default(false) | bool)
              and hostvars[h].ansible_password is not defined -%}
          {%- set _ = ns.items.append(h) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Prompt for root password
  ansible.builtin.pause:
    prompt: 'Root password for {{ item }}'
    echo: false
  loop: '{{ _bootstrap_hosts }}'
  loop_control:
    label: '{{ item }}'
  register: _passwords
  no_log: true
  when: _bootstrap_hosts | length > 0

- name: Configure hosts needing bootstrap
  ansible.builtin.add_host:
    name: '{{ _bootstrap_hosts[idx] }}'
    groups: wormhole_reachable
    needs_bootstrap: true
    ansible_password: '{{ _passwords.results[idx].user_input }}'
    ansible_ssh_common_args: '{{ _password_ssh_args }}'
    ansible_ssh_public_key_path: '{{ hostvars[_h].ansible_ssh_public_key_path }}'
    wormhole_ssh_reachable: 'yes'
    wormhole_ssh_key_ok: 'no'
    wormhole_ssh_hops: '{{ hostvars[_h].wormhole_ssh_hops | default("") }}'
    wormhole_ssh_proxy_command: '{{ _proxy }}'
    wormhole_ssh_discovered: 'yes'
    wormhole_ssh_args_from_inventory: '{{ hostvars[_h].wormhole_ssh_args_from_inventory | default("") }}'
  vars:
    _h: '{{ _bootstrap_hosts[idx] }}'
    _proxy: '{{ hostvars[_h].wormhole_ssh_proxy_command | default("") }}'
    _password_ssh_args: >-
      {{
        (
          ('-o ProxyCommand="' ~ _proxy ~ '" ')
          if _proxy | length > 0
          else ''
        )
        ~ '-o PreferredAuthentications=password -o PubkeyAuthentication=no'
      }}
  loop: '{{ range(_bootstrap_hosts | length) | list }}'
  loop_control:
    loop_var: idx
    label: '{{ _bootstrap_hosts[idx] }}'
  no_log: true
  when: _bootstrap_hosts | length > 0

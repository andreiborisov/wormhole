---
- name: Require rules.profile
  ansible.builtin.assert:
    that:
      - rules is defined
      - rules.profile is defined
      - rules.profile | length > 0
    fail_msg: Set rules.profile to ru or non-ru on this host

- name: Set local compiled rule-set paths
  ansible.builtin.set_fact:
    wormhole_ruleset_dir: '{{ rulesets_dir }}/{{ inventory_hostname }}'
    wormhole_ruleset_json: '{{ rulesets_dir }}/{{ inventory_hostname }}/profile.json'
    wormhole_ruleset_srs: '{{ rulesets_dir }}/{{ inventory_hostname }}/profile.srs'
    wormhole_include_json: '{{ rulesets_dir }}/{{ inventory_hostname }}/include.json'
    wormhole_include_srs: '{{ rulesets_dir }}/{{ inventory_hostname }}/include.srs'
    wormhole_direct_json: '{{ rulesets_dir }}/{{ inventory_hostname }}/direct.json'
    wormhole_direct_srs: '{{ rulesets_dir }}/{{ inventory_hostname }}/direct.srs'
    wormhole_always_direct_json: '{{ rulesets_dir }}/{{ inventory_hostname }}/always_direct.json'
    wormhole_always_direct_srs: '{{ rulesets_dir }}/{{ inventory_hostname }}/always_direct.srs'

- name: Create local rule-set directory
  ansible.builtin.file:
    path: '{{ wormhole_ruleset_dir }}'
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Build compose argv
  ansible.builtin.set_fact:
    wormhole_compose_argv: "{{ [
      'node',
      playbook_dir ~ '/../scripts/compose_rules.mjs',
      '--profile',
      rules.profile,
      '--write-ruleset',
      wormhole_ruleset_json,
      '--write-include-ruleset',
      wormhole_include_json,
      '--write-direct-ruleset',
      wormhole_direct_json,
      '--write-always-direct-ruleset',
      wormhole_always_direct_json
    ] }}"

- name: Add extra include set names
  ansible.builtin.set_fact:
    wormhole_compose_argv: "{{ wormhole_compose_argv + ['--include=' ~ item] }}"
  loop: '{{ rules.include | default([]) }}'

- name: Add extra exclude set names
  ansible.builtin.set_fact:
    wormhole_compose_argv: "{{ wormhole_compose_argv + ['--exclude=' ~ item] }}"
  loop: '{{ rules.exclude | default([]) }}'

- name: Add extra direct set names
  ansible.builtin.set_fact:
    wormhole_compose_argv: "{{ wormhole_compose_argv + ['--direct=' ~ item] }}"
  loop: '{{ rules.direct | default([]) }}'

- name: Add extra always_direct set names
  ansible.builtin.set_fact:
    wormhole_compose_argv: "{{ wormhole_compose_argv + ['--always-direct=' ~ item] }}"
  loop: '{{ rules.always_direct | default([]) }}'

- name: Compose rule sets
  ansible.builtin.command:
    argv: "{{ wormhole_compose_argv }}"
    chdir: '{{ playbook_dir }}/..'
  delegate_to: localhost
  become: false
  changed_when: false
  register: wormhole_rules_raw

- name: Expose composed rule sets
  ansible.builtin.set_fact:
    wormhole_composed: '{{ wormhole_rules_raw.stdout | from_json }}'

- name: Compile profile rule-set
  ansible.builtin.command:
    argv:
      - sing-box
      - rule-set
      - compile
      - '{{ wormhole_ruleset_json }}'
      - -o
      - '{{ wormhole_ruleset_srs }}'
  delegate_to: localhost
  become: false
  changed_when: false

- name: Compile include dest rule-set
  ansible.builtin.command:
    argv:
      - sing-box
      - rule-set
      - compile
      - '{{ wormhole_include_json }}'
      - -o
      - '{{ wormhole_include_srs }}'
  delegate_to: localhost
  become: false
  changed_when: false

- name: Compile direct dest rule-set
  ansible.builtin.command:
    argv:
      - sing-box
      - rule-set
      - compile
      - '{{ wormhole_direct_json }}'
      - -o
      - '{{ wormhole_direct_srs }}'
  delegate_to: localhost
  become: false
  changed_when: false

- name: Compile always_direct rule-set
  ansible.builtin.command:
    argv:
      - sing-box
      - rule-set
      - compile
      - '{{ wormhole_always_direct_json }}'
      - -o
      - '{{ wormhole_always_direct_srs }}'
  delegate_to: localhost
  become: false
  changed_when: false

- name: Deploy compiled profile rule-set
  ansible.builtin.copy:
    src: '{{ wormhole_ruleset_srs }}'
    dest: '{{ deploy_dir }}/sing-box/rule-set.srs'
    mode: '0644'
  notify: Restart sing-box

- name: Deploy compiled include dest rule-set
  ansible.builtin.copy:
    src: '{{ wormhole_include_srs }}'
    dest: '{{ deploy_dir }}/sing-box/include.srs'
    mode: '0644'
  notify: Restart sing-box

- name: Deploy compiled direct dest rule-set
  ansible.builtin.copy:
    src: '{{ wormhole_direct_srs }}'
    dest: '{{ deploy_dir }}/sing-box/direct.srs'
    mode: '0644'
  notify: Restart sing-box

- name: Deploy compiled always_direct rule-set
  ansible.builtin.copy:
    src: '{{ wormhole_always_direct_srs }}'
    dest: '{{ deploy_dir }}/sing-box/always_direct.srs'
    mode: '0644'
  notify: Restart sing-box

- name: Remove unused hop dest rule-set
  ansible.builtin.file:
    path: '{{ deploy_dir }}/sing-box/hop.srs'
    state: absent
  notify: Restart sing-box

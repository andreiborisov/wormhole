---
- name: Create local VLESS key directory
  ansible.builtin.file:
    path: '{{ keys_dir }}/vless/{{ inventory_hostname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Check if local Reality private key exists
  ansible.builtin.stat:
    path: '{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_private.key'
  register: _reality_private_key_stat
  delegate_to: localhost
  become: false

- name: Generate local Reality keypair and short ID
  ansible.builtin.shell: |
    set -eu
    priv_key_path="{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_private.key"
    pub_key_path="{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_public.key"
    short_id_path="{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_short_id"

    keypair="$(sing-box generate reality-keypair)"
    priv_b64="$(printf '%s\n' "$keypair" | awk -F': ' '/^PrivateKey:/ {print $2}')"
    pub_b64="$(printf '%s\n' "$keypair" | awk -F': ' '/^PublicKey:/ {print $2}')"
    short_id="$(sing-box generate rand 8 --hex)"
    [ -n "$priv_b64" ] && [ -n "$pub_b64" ] && [ -n "$short_id" ]

    printf '%s\n' "$priv_b64" > "$priv_key_path"
    printf '%s\n' "$pub_b64" > "$pub_key_path"
    printf '%s\n' "$short_id" > "$short_id_path"
    chmod 0600 "{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_private.key"
    chmod 0600 "{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_public.key"
    chmod 0600 "{{ keys_dir }}/vless/{{ inventory_hostname }}/reality_short_id"
  when: not _reality_private_key_stat.stat.exists
  no_log: true
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Set Reality server facts
  ansible.builtin.set_fact:
    vless: >-
      {{
        vless | combine({
          'private_key': (lookup('file', keys_dir ~ '/vless/' ~ inventory_hostname ~ '/reality_private.key') | trim),
          'public_key': (lookup('file', keys_dir ~ '/vless/' ~ inventory_hostname ~ '/reality_public.key') | trim),
          'short_id': (lookup('file', keys_dir ~ '/vless/' ~ inventory_hostname ~ '/reality_short_id') | trim)
        }, recursive=True)
      }}
  no_log: true

- name: Check if VLESS client UUID files exist
  ansible.builtin.stat:
    path: '{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.client_id }}.uuid'
  loop: '{{ vpn_clients }}'
  register: _vless_client_uuid_stats
  delegate_to: localhost
  become: false

- name: Generate missing VLESS client UUIDs locally
  ansible.builtin.shell: |
    python3 - <<'PY'
    import pathlib
    import uuid
    pathlib.Path("{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.item.client_id }}.uuid").write_text(str(uuid.uuid4()) + "\n")
    PY
    chmod 0600 "{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.item.client_id }}.uuid"
  loop: '{{ _vless_client_uuid_stats.results | default([]) }}'
  when:
    - item.item.uuid | length == 0
    - not item.stat.exists
  no_log: true
  delegate_to: localhost
  become: false

- name: Initialize enriched VLESS client list
  ansible.builtin.set_fact:
    vless_clients_with_credentials: []
  no_log: true

- name: Build enriched VLESS client list
  ansible.builtin.set_fact:
    vless_clients_with_credentials: '{{ (vless_clients_with_credentials | default([])) + [client_with_uuid] }}'
  vars:
    client_with_uuid: >-
      {{
        item | combine({
          'uuid': (item.uuid if item.uuid | length > 0 else (lookup('file', keys_dir ~ '/vless/' ~ inventory_hostname ~ '/' ~ item.client_id ~ '.uuid') | trim))
        })
      }}
  loop: '{{ vpn_clients }}'
  no_log: true

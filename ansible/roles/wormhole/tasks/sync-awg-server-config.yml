---
- name: Find leftover per-peer AWG interface configs
  ansible.builtin.find:
    paths: '{{ deploy_dir }}/amneziawg'
    patterns: 'awg-in-*.conf'
  register: _stale_awg_confs

- name: Remove leftover per-peer AWG interface configs
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ _stale_awg_confs.files | default([]) }}'
  notify: Restart amneziawg

- name: Deploy shared AWG interface config
  ansible.builtin.template:
    src: amneziawg/awg-in.conf.j2
    dest: '{{ deploy_dir }}/amneziawg/awg-in.conf'
    mode: '0600'
  notify: Restart amneziawg

---
- name: Compose named rule sets for this node's profile
  ansible.builtin.include_tasks:
    file: compose-rules.yml

- name: Build deterministic peer list
  ansible.builtin.set_fact:
    stable_peers: '{{ (peers | default([]) | unique | sort) }}'

- name: Create local peer config directories
  ansible.builtin.file:
    path: '{{ local_dir }}/amneziawg/configs/{{ inventory_hostname }}'
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Normalize AmneziaWG clients
  ansible.builtin.set_fact:
    awg_clients_normalized: >-
      {%- set result = [] -%} {%- for client in clients | default([]) -%}
        {%- set client_name = client.name if client is mapping else client -%}
        {%- if client_name not in (result | map(attribute='name') | list) -%}
          {%- set _ = result.append({'name': client_name}) -%}
        {%- endif -%}
      {%- endfor -%} {{ result }}

- name: Create local AmneziaWG client config subdirectories
  ansible.builtin.file:
    path: '{{ local_dir }}/amneziawg/configs/{{ inventory_hostname }}/{{ item.name }}'
    state: directory
    mode: '0755'
  loop: '{{ awg_clients_normalized | default([]) }}'
  delegate_to: localhost
  become: false


- name: Build AmneziaWG client profile matrix
  ansible.builtin.set_fact:
    awg_client_profiles: >-
      {%- set result = [] -%} {%- set _peer_count = (stable_peers | default([]) | length) -%} {%- for client in awg_clients_normalized | default([]) -%}
        {%- if _peer_count > 0 -%}
          {%- for p_idx in range(_peer_count) -%}
            {%- set selected_peer = stable_peers[p_idx] -%}
            {%- set selected_awg_subnet = hostvars[selected_peer]['awg']['subnet'] | default(awg.subnet) -%}
            {%- for mode in ['split', 'full'] -%}
            {%- set profile_name = client.name ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer ~ '-' ~ mode -%}
            {%- set _ = result.append({
              'name': client.name,
              'apply_rules': (mode == 'split'),
              'mode': mode,
              'selected_peer': selected_peer,
              'profile_name': profile_name,
              'key_id': profile_name,
              'awg_subnet': selected_awg_subnet,
              'subnet': selected_awg_subnet,
              'listen_port': (awg.port | int) + p_idx
            }) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%} {{ result }}

- name: Assign AmneziaWG client IPs
  ansible.builtin.command:
    argv:
      - node
      - '{{ playbook_dir }}/../scripts/assign_vpn_addresses.mjs'
      - client-ips
    stdin: "{{ {'profiles': awg_client_profiles} | to_json }}"
    chdir: '{{ playbook_dir }}/..'
  register: awg_client_ips_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when: (awg_client_profiles | default([]) | length) > 0

- name: Expose AmneziaWG profiles with client IPs
  ansible.builtin.set_fact:
    awg_client_profiles: '{{ (awg_client_ips_raw.stdout | from_json).profiles }}'
  when: (awg_client_profiles | default([]) | length) > 0


- name: Check if AmneziaWG profile private keys exist
  ansible.builtin.stat:
    path: '{{ local_dir }}/amneziawg/keys/{{ inventory_hostname }}/{{ item.key_id }}.key'
  loop: '{{ awg_client_profiles | default([]) }}'
  register: _peer_key_stats
  delegate_to: localhost
  become: false

- name: Generate AmneziaWG profile private keys
  ansible.builtin.shell: |
    set -eu
    key_path="{{ local_dir }}/amneziawg/keys/{{ inventory_hostname }}/{{ item.item.key_id }}.key"
    wg genkey > "$key_path"
    chmod 0600 "$key_path"
  loop: '{{ _peer_key_stats.results }}'
  when: not item.stat.exists
  no_log: true
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Derive AmneziaWG profile public keys
  ansible.builtin.shell: |
    key_path="{{ local_dir }}/amneziawg/keys/{{ inventory_hostname }}/{{ item.key_id }}.key"
    wg pubkey < "$key_path"
  loop: '{{ awg_client_profiles | default([]) }}'
  register: _peer_pubkeys
  changed_when: false
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Build enriched AmneziaWG profile list with public keys
  ansible.builtin.set_fact:
    awg_clients_with_keys: >-
      {%- set result = [] -%} {%- for i in range((awg_client_profiles | default([])) | length) -%}
        {%- set profile = (awg_client_profiles | default([]))[i] -%}
        {%- set pubkey = _peer_pubkeys.results[i].stdout -%}
        {%- set _ = result.append(profile | combine({'public_key': pubkey})) -%}
      {%- endfor -%} {{ result }}


- name: Render client VPN configs
  ansible.builtin.template:
    src: amneziawg/client.conf.j2
    dest: '{{ local_dir }}/amneziawg/configs/{{ inventory_hostname }}/{{ awg_peer.name }}/{{ awg_peer.profile_name }}.conf'
    mode: '0600'
  loop: '{{ awg_clients_with_keys | default([]) }}'
  loop_control:
    loop_var: awg_peer
  vars:
    peer: '{{ awg_peer }}'
    peer_private_key: "{{ lookup('file', local_dir ~ '/amneziawg/keys/' ~ inventory_hostname ~ '/' ~ awg_peer.key_id ~ '.key') }}"
  delegate_to: localhost
  become: false

- name: Create local WireGuard peer config directory
  ansible.builtin.file:
    path: '{{ local_dir }}/wireguard/configs/{{ inventory_hostname }}'
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Normalize WireGuard clients
  ansible.builtin.set_fact:
    wg_clients_normalized: >-
      {%- set result = [] -%} {%- for client in clients | default([]) -%}
        {%- set client_name = client.name if client is mapping else client -%}
        {%- if client_name not in (result | map(attribute='name') | list) -%}
          {%- set _ = result.append({'name': client_name}) -%}
        {%- endif -%}
      {%- endfor -%} {{ result }}

  when: wg.subnet is defined

- name: Create local WireGuard client config subdirectories
  ansible.builtin.file:
    path: '{{ local_dir }}/wireguard/configs/{{ inventory_hostname }}/{{ item.name }}'
    state: directory
    mode: '0755'
  loop: '{{ wg_clients_normalized | default([]) }}'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Build WireGuard client profile matrix
  ansible.builtin.set_fact:
    wg_client_profiles: >-
      {%- set result = [] -%} {%- set _peer_count = (stable_peers | default([]) | length) -%} {%- for client in wg_clients_normalized | default([]) -%}
        {%- if _peer_count > 0 -%}
          {%- for p_idx in range(_peer_count) -%}
            {%- set selected_peer = stable_peers[p_idx] -%}
            {%- for mode in ['split', 'full'] -%}
            {%- set profile_name = client.name ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer ~ '-' ~ mode -%}
            {%- set _ = result.append({
              'name': client.name,
              'apply_rules': (mode == 'split'),
              'mode': mode,
              'selected_peer': selected_peer,
              'profile_name': profile_name,
              'key_id': profile_name,
              'subnet': wg.subnet,
              'listen_port': (wg.port | default(51821) | int) + p_idx
            }) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%} {{ result }}

  when: wg.subnet is defined

- name: Assign WireGuard client IPs
  ansible.builtin.command:
    argv:
      - node
      - '{{ playbook_dir }}/../scripts/assign_vpn_addresses.mjs'
      - client-ips
    stdin: "{{ {'profiles': wg_client_profiles} | to_json }}"
    chdir: '{{ playbook_dir }}/..'
  register: wg_client_ips_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when:
    - wg.subnet is defined
    - (wg_client_profiles | default([]) | length) > 0

- name: Expose WireGuard profiles with client IPs
  ansible.builtin.set_fact:
    wg_client_profiles: '{{ (wg_client_ips_raw.stdout | from_json).profiles }}'
  when:
    - wg.subnet is defined
    - (wg_client_profiles | default([]) | length) > 0

- name: Check if WireGuard profile private keys exist
  ansible.builtin.stat:
    path: '{{ local_dir }}/wireguard/keys/{{ inventory_hostname }}/{{ item.key_id }}.key'
  loop: '{{ wg_client_profiles | default([]) }}'
  register: _wg_peer_key_stats
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Generate WireGuard profile private keys
  ansible.builtin.shell: |
    set -eu
    key_path="{{ local_dir }}/wireguard/keys/{{ inventory_hostname }}/{{ item.item.key_id }}.key"
    wg genkey > "$key_path"
    chmod 0600 "$key_path"
  loop: '{{ _wg_peer_key_stats.results | default([]) }}'
  when:
    - wg.subnet is defined
    - not item.stat.exists
  no_log: true
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Derive WireGuard peer public keys
  ansible.builtin.shell: |
    key_path="{{ local_dir }}/wireguard/keys/{{ inventory_hostname }}/{{ item.key_id }}.key"
    wg pubkey < "$key_path"
  loop: '{{ wg_client_profiles | default([]) }}'
  register: _wg_peer_pubkeys
  changed_when: false
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Build enriched WireGuard peer list with public keys
  ansible.builtin.set_fact:
    wireguard_clients_with_keys: >-
      {%- set result = [] -%} {%- for i in range((wg_client_profiles | default([])) | length) -%}
        {%- set profile = (wg_client_profiles | default([]))[i] -%}
        {%- set pubkey = _wg_peer_pubkeys.results[i].stdout -%}
        {%- set _ = result.append(profile | combine({'public_key': pubkey})) -%}
      {%- endfor -%} {{ result }}

  when: wg.subnet is defined

- name: Render WireGuard client configs
  ansible.builtin.template:
    src: wireguard/client.conf.j2
    dest: '{{ local_dir }}/wireguard/configs/{{ inventory_hostname }}/{{ wg_peer.name }}/{{ wg_peer.profile_name }}.conf'
    mode: '0600'
  loop: '{{ wireguard_clients_with_keys | default([]) }}'
  loop_control:
    loop_var: wg_peer
  vars:
    peer: '{{ wg_peer }}'
    peer_private_key: "{{ lookup('file', local_dir ~ '/wireguard/keys/' ~ inventory_hostname ~ '/' ~ wg_peer.key_id ~ '.key') }}"
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Assert VPN client IPs are unique per subnet
  ansible.builtin.assert:
    that:
      - vpn_client_ip_duplicates | length == 0
    fail_msg: "Duplicate VPN client IPs: {{ vpn_client_ip_duplicates | join(', ') }}"
  vars:
    vpn_client_ip_duplicates: >-
      {%- set seen = {} -%}
      {%- set dupes = [] -%}
      {%- for h in groups['all'] -%}
        {%- for p in hostvars[h]['awg_client_profiles'] | default([]) -%}
          {%- set key = (p.subnet | default(p.awg_subnet)) ~ '|' ~ p.ip -%}
          {%- if key in seen -%}
            {%- set _ = dupes.append(key ~ ' (' ~ seen[key] ~ ' vs ' ~ h ~ '/' ~ p.profile_name ~ ')') -%}
          {%- else -%}
            {%- set _ = seen.update({key: h ~ '/' ~ p.profile_name}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for p in hostvars[h]['wg_client_profiles'] | default([]) -%}
          {%- set key = (p.subnet | default(hostvars[h]['wg']['subnet'])) ~ '|' ~ p.ip -%}
          {%- if key in seen -%}
            {%- set _ = dupes.append(key ~ ' (' ~ seen[key] ~ ' vs ' ~ h ~ '/wg/' ~ p.profile_name ~ ')') -%}
          {%- else -%}
            {%- set _ = seen.update({key: h ~ '/wg/' ~ p.profile_name}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ dupes }}
  run_once: true

- name: Build enriched VLESS client profile list
  ansible.builtin.set_fact:
    vless_clients_with_credentials: >-
      {%- set result = [] -%} {%- for client in vless_clients_with_credentials | default([]) -%}
        {%- for selected_peer in stable_peers | default([]) -%}
          {%- set profile_name = client.name ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer -%}
          {%- set _ = result.append({
            'name': client.name,
            'auth_user': profile_name,
            'profile_name': profile_name,
            'selected_peer': selected_peer,
            'uuid': client.uuid
          }) -%}
        {%- endfor -%}
      {%- endfor -%} {{ result }}

  when:
    - (vless_clients_with_credentials | default([]) | length) > 0

- name: Create local VLESS client config subdirectories
  ansible.builtin.file:
    path: '{{ local_dir }}/vless/configs/{{ inventory_hostname }}/{{ item }}'
    state: directory
    mode: '0755'
  loop: '{{ vless_clients_with_credentials | default([]) | map(attribute="name") | unique | list }}'
  delegate_to: localhost
  become: false
  when:
    - (vless_clients_with_credentials | default([]) | length) > 0

- name: Render VLESS Reality client URI profiles
  ansible.builtin.template:
    src: vless/client-uri.txt.j2
    dest: '{{ local_dir }}/vless/configs/{{ inventory_hostname }}/{{ vless_peer.name }}/{{ vless_peer.profile_name }}.txt'
    mode: '0600'
  loop: '{{ vless_clients_with_credentials | default([]) }}'
  loop_control:
    loop_var: vless_peer
  vars:
    peer: '{{ vless_peer }}'
  delegate_to: localhost
  become: false
  when:
    - (vless_clients_with_credentials | default([]) | length) > 0

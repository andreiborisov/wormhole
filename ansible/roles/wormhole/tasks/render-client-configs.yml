---
- name: Compose named rule sets for this node's profile
  ansible.builtin.include_tasks:
    file: compose-rules.yml

- name: Build deterministic peer list
  ansible.builtin.set_fact:
    stable_peers: '{{ (peers | default([]) | unique | sort) }}'

- name: Reset published user config directories
  ansible.builtin.file:
    path: '{{ configs_dir }}/{{ item }}'
    state: absent
  loop: '{{ user_devices.keys() | list }}'
  run_once: true
  delegate_to: localhost
  become: false

- name: Create local AmneziaWG client key directory
  ansible.builtin.file:
    path: '{{ keys_dir }}/amneziawg/{{ inventory_hostname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Create AmneziaWG client config directories
  ansible.builtin.file:
    path: '{{ configs_dir }}/{{ item.user }}/{{ item.device }}/amneziawg'
    state: directory
    mode: '0700'
  loop: '{{ vpn_clients | default([]) }}'
  delegate_to: localhost
  become: false

- name: Build AmneziaWG client profile matrix
  ansible.builtin.set_fact:
    awg_client_profiles: >-
      {%- set result = [] -%}
      {%- for client in vpn_clients | default([]) -%}
        {%- for selected_peer in stable_peers | default([]) -%}
          {%- set selected_awg_subnet = hostvars[selected_peer]['awg']['subnet'] | default(awg.subnet) -%}
          {%- for mode in ['split', 'full'] -%}
          {%- set key_id = client.user ~ '-' ~ client.device ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer -%}
          {%- set profile_name = key_id ~ '-' ~ mode -%}
          {%- set config_stem = 'wormhole-' ~ inventory_hostname ~ '-' ~ selected_peer ~ '-' ~ mode -%}
          {%- set _ = result.append({
            'name': client.name,
            'user': client.user,
            'device': client.device,
            'apply_rules': (mode == 'split'),
            'mode': mode,
            'entry': inventory_hostname,
            'exit': selected_peer,
            'selected_peer': selected_peer,
            'config_stem': config_stem,
            'key_id': key_id,
            'profile_name': profile_name,
            'awg_subnet': selected_awg_subnet,
            'subnet': selected_awg_subnet,
            'listen_port': (awg.port | int)
          }) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

- name: Assign AmneziaWG client IPs
  ansible.builtin.command:
    argv:
      - node
      - '{{ playbook_dir }}/../scripts/assign_vpn_addresses.mjs'
      - client-ips
    stdin: "{{ {'profiles': awg_client_profiles} | to_json }}"
    chdir: '{{ playbook_dir }}/..'
  register: awg_client_ips_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when: (awg_client_profiles | default([]) | length) > 0

- name: Expose AmneziaWG profiles with client IPs
  ansible.builtin.set_fact:
    awg_client_profiles: '{{ (awg_client_ips_raw.stdout | from_json).profiles }}'
  when: (awg_client_profiles | default([]) | length) > 0

- name: Deduplicate AmneziaWG key identities
  ansible.builtin.set_fact:
    awg_key_profiles: >-
      {%- set seen = {} -%}
      {%- for p in awg_client_profiles | default([]) -%}
        {%- if p.key_id not in seen -%}
          {%- set _ = seen.update({p.key_id: p}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ seen | dict2items | map(attribute='value') | list }}

- name: Check if AmneziaWG profile private keys exist
  ansible.builtin.stat:
    path: '{{ keys_dir }}/amneziawg/{{ inventory_hostname }}/{{ item.key_id }}.key'
  loop: '{{ awg_key_profiles | default([]) }}'
  register: _peer_key_stats
  delegate_to: localhost
  become: false

- name: Generate AmneziaWG profile private keys
  ansible.builtin.shell: |
    set -eu
    key_path="{{ keys_dir }}/amneziawg/{{ inventory_hostname }}/{{ item.item.key_id }}.key"
    wg genkey > "$key_path"
    chmod 0600 "$key_path"
  loop: '{{ _peer_key_stats.results | default([]) }}'
  when: not item.stat.exists
  no_log: true
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Derive AmneziaWG profile public keys
  ansible.builtin.shell: |
    key_path="{{ keys_dir }}/amneziawg/{{ inventory_hostname }}/{{ item.key_id }}.key"
    wg pubkey < "$key_path"
  loop: '{{ awg_key_profiles | default([]) }}'
  register: _peer_pubkeys
  changed_when: false
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Build enriched AmneziaWG profile list with public keys
  ansible.builtin.set_fact:
    awg_clients_with_keys: >-
      {%- set pub = {} -%}
      {%- for item in _peer_pubkeys.results | default([]) -%}
        {%- set _ = pub.update({item.item.key_id: item.stdout}) -%}
      {%- endfor -%}
      {%- set result = [] -%}
      {%- for profile in awg_client_profiles | default([]) -%}
        {%- set _ = result.append(profile | combine({'public_key': pub[profile.key_id]})) -%}
      {%- endfor -%}
      {{ result }}

- name: Render client VPN configs
  ansible.builtin.template:
    src: amneziawg/client.conf.j2
    dest: '{{ configs_dir }}/{{ awg_peer.user }}/{{ awg_peer.device }}/amneziawg/{{ awg_peer.config_stem }}.conf'
    mode: '0600'
  loop: '{{ awg_clients_with_keys | default([]) }}'
  loop_control:
    loop_var: awg_peer
  vars:
    peer: '{{ awg_peer }}'
    peer_private_key: "{{ lookup('file', keys_dir ~ '/amneziawg/' ~ inventory_hostname ~ '/' ~ awg_peer.key_id ~ '.key') }}"
  delegate_to: localhost
  become: false

- name: Create local WireGuard client key directory
  ansible.builtin.file:
    path: '{{ keys_dir }}/wireguard/{{ inventory_hostname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Create WireGuard client config directories
  ansible.builtin.file:
    path: '{{ configs_dir }}/{{ item.user }}/{{ item.device }}/wireguard'
    state: directory
    mode: '0700'
  loop: '{{ vpn_clients | default([]) }}'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Build WireGuard client profile matrix
  ansible.builtin.set_fact:
    wg_client_profiles: >-
      {%- set result = [] -%}
      {%- for client in vpn_clients | default([]) -%}
        {%- for selected_peer in stable_peers | default([]) -%}
          {%- set selected_wg_subnet = hostvars[selected_peer]['wg']['subnet'] | default(wg.subnet) -%}
          {%- for mode in ['split', 'full'] -%}
          {%- set key_id = client.user ~ '-' ~ client.device ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer -%}
          {%- set profile_name = key_id ~ '-' ~ mode -%}
          {%- set config_stem = 'wormhole-' ~ inventory_hostname ~ '-' ~ selected_peer ~ '-' ~ mode -%}
          {%- set _ = result.append({
            'name': client.name,
            'user': client.user,
            'device': client.device,
            'apply_rules': (mode == 'split'),
            'mode': mode,
            'entry': inventory_hostname,
            'exit': selected_peer,
            'selected_peer': selected_peer,
            'config_stem': config_stem,
            'key_id': key_id,
            'profile_name': profile_name,
            'subnet': selected_wg_subnet,
            'listen_port': (wg.port | default(51822) | int)
          }) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}
  when: wg.subnet is defined

- name: Assign WireGuard client IPs
  ansible.builtin.command:
    argv:
      - node
      - '{{ playbook_dir }}/../scripts/assign_vpn_addresses.mjs'
      - client-ips
    stdin: "{{ {'profiles': wg_client_profiles} | to_json }}"
    chdir: '{{ playbook_dir }}/..'
  register: wg_client_ips_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when:
    - wg.subnet is defined
    - (wg_client_profiles | default([]) | length) > 0

- name: Expose WireGuard profiles with client IPs
  ansible.builtin.set_fact:
    wg_client_profiles: '{{ (wg_client_ips_raw.stdout | from_json).profiles }}'
  when:
    - wg.subnet is defined
    - (wg_client_profiles | default([]) | length) > 0

- name: Deduplicate WireGuard key identities
  ansible.builtin.set_fact:
    wg_key_profiles: >-
      {%- set seen = {} -%}
      {%- for p in wg_client_profiles | default([]) -%}
        {%- if p.key_id not in seen -%}
          {%- set _ = seen.update({p.key_id: p}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ seen | dict2items | map(attribute='value') | list }}
  when: wg.subnet is defined

- name: Check if WireGuard profile private keys exist
  ansible.builtin.stat:
    path: '{{ keys_dir }}/wireguard/{{ inventory_hostname }}/{{ item.key_id }}.key'
  loop: '{{ wg_key_profiles | default([]) }}'
  register: _wg_peer_key_stats
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Generate WireGuard profile private keys
  ansible.builtin.shell: |
    set -eu
    key_path="{{ keys_dir }}/wireguard/{{ inventory_hostname }}/{{ item.item.key_id }}.key"
    wg genkey > "$key_path"
    chmod 0600 "$key_path"
  loop: '{{ _wg_peer_key_stats.results | default([]) }}'
  when:
    - wg.subnet is defined
    - not item.stat.exists
  no_log: true
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false

- name: Derive WireGuard peer public keys
  ansible.builtin.shell: |
    key_path="{{ keys_dir }}/wireguard/{{ inventory_hostname }}/{{ item.key_id }}.key"
    wg pubkey < "$key_path"
  loop: '{{ wg_key_profiles | default([]) }}'
  register: _wg_peer_pubkeys
  changed_when: false
  environment:
    PATH: '/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Build enriched WireGuard peer list with public keys
  ansible.builtin.set_fact:
    wireguard_clients_with_keys: >-
      {%- set pub = {} -%}
      {%- for item in _wg_peer_pubkeys.results | default([]) -%}
        {%- set _ = pub.update({item.item.key_id: item.stdout}) -%}
      {%- endfor -%}
      {%- set result = [] -%}
      {%- for profile in wg_client_profiles | default([]) -%}
        {%- set _ = result.append(profile | combine({'public_key': pub[profile.key_id]})) -%}
      {%- endfor -%}
      {{ result }}
  when: wg.subnet is defined

- name: Render WireGuard client configs
  ansible.builtin.template:
    src: wireguard/client.conf.j2
    dest: '{{ configs_dir }}/{{ wg_peer.user }}/{{ wg_peer.device }}/wireguard/{{ wg_peer.config_stem }}.conf'
    mode: '0600'
  loop: '{{ wireguard_clients_with_keys | default([]) }}'
  loop_control:
    loop_var: wg_peer
  vars:
    peer: '{{ wg_peer }}'
    peer_private_key: "{{ lookup('file', keys_dir ~ '/wireguard/' ~ inventory_hostname ~ '/' ~ wg_peer.key_id ~ '.key') }}"
  delegate_to: localhost
  become: false
  when: wg.subnet is defined

- name: Assert VPN client IPs are unique per device in each subnet
  ansible.builtin.assert:
    that:
      - vpn_client_ip_duplicates | length == 0
    fail_msg: "Duplicate VPN client IPs: {{ vpn_client_ip_duplicates | join(', ') }}"
  vars:
    vpn_client_ip_duplicates: >-
      {%- set seen = {} -%}
      {%- set dupes = [] -%}
      {%- for h in groups['all'] -%}
        {%- for p in hostvars[h]['awg_client_profiles'] | default([]) -%}
          {%- set key = (p.subnet | default(p.awg_subnet)) ~ '|' ~ p.ip -%}
          {%- set ident = p.user ~ '/' ~ p.device -%}
          {%- if key in seen -%}
            {%- if seen[key] != ident -%}
              {%- set _ = dupes.append(key ~ ' (' ~ seen[key] ~ ' vs ' ~ ident ~ ')') -%}
            {%- endif -%}
          {%- else -%}
            {%- set _ = seen.update({key: ident}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for p in hostvars[h]['wg_client_profiles'] | default([]) -%}
          {%- set key = (p.subnet | default(hostvars[h]['wg']['subnet'])) ~ '|' ~ p.ip -%}
          {%- set ident = p.user ~ '/' ~ p.device -%}
          {%- if key in seen -%}
            {%- if seen[key] != ident -%}
              {%- set _ = dupes.append(key ~ ' (' ~ seen[key] ~ ' vs ' ~ ident ~ ')') -%}
            {%- endif -%}
          {%- else -%}
            {%- set _ = seen.update({key: ident}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ dupes }}
  run_once: true

- name: Build VLESS client profile matrix
  ansible.builtin.set_fact:
    vless_client_profiles: >-
  ansible.builtin.set_fact:
    vless_client_profiles: >-
      {%- set result = [] -%}
      {%- for client in vpn_clients | default([]) -%}
        {%- for selected_peer in stable_peers | default([]) -%}
          {%- set auth_user = client.user ~ '-' ~ client.device ~ '-' ~ inventory_hostname ~ '-' ~ selected_peer -%}
          {%- set _ = result.append({
            'name': client.name,
            'user': client.user,
            'device': client.device,
            'auth_user': auth_user,
            'config_stem': 'wormhole-' ~ inventory_hostname ~ '-' ~ selected_peer,
            'profile_name': auth_user,
            'selected_peer': selected_peer
          }) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}
  when:
    - (vpn_clients | default([]) | length) > 0

- name: Ensure VLESS key directory exists
  ansible.builtin.file:
    path: '{{ keys_dir }}/vless/{{ inventory_hostname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when:
    - (vless_client_profiles | default([]) | length) > 0

- name: Check if VLESS path UUID files exist
  ansible.builtin.stat:
    path: '{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.auth_user }}.uuid'
  loop: '{{ vless_client_profiles | default([]) }}'
  register: _vless_path_uuid_stats
  delegate_to: localhost
  become: false
  when:
    - (vless_client_profiles | default([]) | length) > 0

- name: Generate missing VLESS path UUIDs
  ansible.builtin.shell: |
    python3 - <<'PY'
    import pathlib
    import uuid
    pathlib.Path("{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.item.auth_user }}.uuid").write_text(str(uuid.uuid4()) + "\n")
    PY
    chmod 0600 "{{ keys_dir }}/vless/{{ inventory_hostname }}/{{ item.item.auth_user }}.uuid"
  loop: '{{ _vless_path_uuid_stats.results | default([]) }}'
  when:
    - (vless_client_profiles | default([]) | length) > 0
    - item.stat is defined
    - not item.stat.exists
  no_log: true
  delegate_to: localhost
  become: false

- name: Build enriched VLESS client profile list
  ansible.builtin.set_fact:
    vless_clients_with_credentials: >-
      {%- set result = [] -%}
      {%- for p in vless_client_profiles | default([]) -%}
        {%- set _ = result.append(p | combine({
          'uuid': (lookup('file', keys_dir ~ '/vless/' ~ inventory_hostname ~ '/' ~ p.auth_user ~ '.uuid') | trim)
        })) -%}
      {%- endfor -%}
      {{ result }}
  no_log: true
  when:
    - (vless_client_profiles | default([]) | length) > 0

- name: Create VLESS client config directories
  ansible.builtin.file:
    path: '{{ configs_dir }}/{{ item.user }}/{{ item.device }}/vless'
    state: directory
    mode: '0700'
  loop: '{{ vpn_clients | default([]) }}'
  delegate_to: localhost
  become: false
  when:
    - (vless_clients_with_credentials | default([]) | length) > 0

- name: Render VLESS Reality client URI profiles
  ansible.builtin.template:
    src: vless/client-uri.txt.j2
    dest: '{{ configs_dir }}/{{ vless_peer.user }}/{{ vless_peer.device }}/vless/{{ vless_peer.config_stem }}.txt'
    mode: '0600'
  loop: '{{ vless_clients_with_credentials | default([]) }}'
  loop_control:
    loop_var: vless_peer
  vars:
    peer: '{{ vless_peer }}'
  delegate_to: localhost
  become: false
  when:
    - (vless_clients_with_credentials | default([]) | length) > 0

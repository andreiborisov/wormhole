---
deploy_dir: /root/wormhole
local_dir: '{{ playbook_dir }}/local/{{ inventory_dir | basename }}'
configs_dir: '{{ local_dir }}/configs'
keys_dir: '{{ local_dir }}/keys'
rulesets_dir: '{{ local_dir }}/rulesets'
tcp_congestion_control: 'bbr'
vpn_subnet_pool: '10.0.0.0/8'
vpn_subnet_prefix: 24
vpn_reserved_cidrs: []
# sing-box AWG TUN. dns_dnat is the /30 peer of address — not local, so
# prerouting DNAT of DNS can be forwarded into the TUN (not INPUT).
awg_tun:
  address: '172.19.10.1/30'
  dns_dnat: '172.19.10.2'
# Hand AWG client TCP to a sing-box redirect inbound (nftables REDIRECT)
# instead of the sb-awg-in TUN. The client's TCP then terminates in the
# kernel straight off awg-in (TSO/GRO intact) and sing-box only copies
# streams: ~20% less CPU per bit on a single-vCPU node. UDP and DNS stay on
# the TUN. Set enabled: false on a host to keep TCP on the TUN too.
awg_tcp_redirect:
  enabled: true
  port: 7891
# Rate (Mbit/s) this node asks its Hysteria2 peers to send at. A non-zero
# value makes the peer use Brutal at that fixed rate instead of BBR. BBRv1
# ignores loss: when a single-vCPU receiver fell behind, 70-80% of the QUIC
# was lost and the peer re-sent 3.5-4.6x the goodput. Brutal never backs off
# either, so set it per host to what this node can process under real load
# (AWG clients share the vCPU), not to the raw link speed, and leave
# headroom. On 1-vCPU dev nodes the ceiling was 600 both ways while the link
# carried >1.5 Gbit/s (800 added only overhead; 2000 collapsed throughput to
# BBR levels), so they run 500. 0 keeps BBR. Upload keeps BBR.
hysteria2:
  down_mbps: 0
awg:
  port: 51820
wg:
  port: 51822
vless:
  port: 443
  handshake_port: 443
  domain: 'www.cloudflare.com'
  max_time_difference: '1m'
  client_fingerprint: 'chrome'
  grpc_service_name: 'api.v1.Gateway'
tailscale:
  base_hostname: 'wormhole'

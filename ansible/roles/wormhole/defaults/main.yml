---
deploy_dir: /root/wormhole
local_dir: '{{ playbook_dir }}/local/{{ inventory_dir | basename }}'
configs_dir: '{{ local_dir }}/configs'
keys_dir: '{{ local_dir }}/keys'
rulesets_dir: '{{ local_dir }}/rulesets'
tcp_congestion_control: 'bbr'
vpn_subnet_pool: '10.0.0.0/8'
vpn_subnet_prefix: 24
vpn_reserved_cidrs: []
# sing-box AWG TUN. dns_dnat is the /30 peer of address — not local, so
# prerouting DNAT of DNS can be forwarded into the TUN (not INPUT).
awg_tun:
  address: '172.19.10.1/30'
  dns_dnat: '172.19.10.2'
awg:
  port: 51820
wg:
  port: 51822
vless:
  port: 443
  handshake_port: 443
  domain: 'www.cloudflare.com'
  max_time_difference: '1m'
  client_fingerprint: 'chrome'
  grpc_service_name: 'api.v1.Gateway'
tailscale:
  base_hostname: 'wormhole'

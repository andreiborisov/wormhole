---
# Full provisioning: installs Docker, generates TLS certs/keys, and deploys
# sing-box + AWG/WireGuard on all nodes.
#
# Usage:
#   ansible-playbook -i inventories/production site.yml
#   ansible-playbook -i inventories/production site.yml --tags client-configs

- name: Provision all nodes
  hosts: all
  roles:
    - wormhole

- name: Pack encrypted per-user config zips
  hosts: all
  gather_facts: false
  tags:
    - client-configs
  tasks:
    - name: Pack user config zips
      ansible.builtin.include_role:
        name: wormhole
        tasks_from: pack-user-zips.yml
      run_once: true

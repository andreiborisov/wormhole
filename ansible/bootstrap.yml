---
# One-time bootstrap: uploads your SSH public key to fresh servers that only
# have root password access, then disables password authentication.
#
# ansible_ssh_private_key_file must be a public key (.pub): a filesystem key
# or a Secretive PublicKeys/*.pub file. OpenSSH's -i accepts either.
#
# Hosts the controller cannot reach directly are bootstrapped through any
# key-reachable inventory host (see discover-ssh.yml). Two rounds so a host
# keyed in the first pass can be a jump in the second.
#
# Safe to re-run: hosts already reachable by key are skipped automatically.
#
# Usage:
#   ansible-playbook -i inventories/production bootstrap.yml

- name: Discover SSH paths
  ansible.builtin.import_playbook: discover-ssh.yml

- name: Bootstrap reachable hosts
  ansible.builtin.import_playbook: bootstrap-round.yml

- name: Discover SSH paths after new keys
  ansible.builtin.import_playbook: discover-ssh.yml

- name: Bootstrap hosts that became reachable
  ansible.builtin.import_playbook: bootstrap-round.yml

- name: Require an SSH path to every play host
  hosts: all
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tasks:
    - name: Fail when this host has no SSH path
      ansible.builtin.fail:
        msg: >-
          No SSH path to {{ inventory_hostname }}
          ({{ hostvars[inventory_hostname].ansible_host | default('unknown') }}).
          Tried the controller and key-reachable inventory hops (max 2).
      when: not (wormhole_ssh_reachable | default(false) | bool)

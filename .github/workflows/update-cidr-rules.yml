name: Update CIDR rules

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and compress CIDR rulesets
        run: node scripts/update_cidr_rules.mjs

      - name: Commit and push
        if: ${{ !env.ACT }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/cidr rules/profiles
          git diff --staged --quiet && exit 0
          git commit -m 'Update CIDR rulesets from upstream'
          git push
